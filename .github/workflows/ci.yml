name: CI

# Builds the deploy package (single-file win-x64 EXE) on every PR into main or
# develop and on pushes to main/develop. The result is attached to the Actions run
# as a downloadable artifact — so anyone can pull the EXE straight from the PR.

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  build:
    name: Build, Test & Package (win-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # build-deploy.sh macht restore -> test -> publish (Single-File, self-contained
      # win-x64) -> assembliert deploy/. Cross-Compile nach Windows ist im Projekt
      # vorgesehen (EnableWindowsTargeting). Schlägt fehl, wenn ein Test fehlschlägt.
      - name: Build deploy package
        run: bash build-deploy.sh

      - name: Upload EXE + Deploy-Paket
        uses: actions/upload-artifact@v7
        with:
          name: SamedisCare.SplSync-win-x64
          path: deploy/
          if-no-files-found: error
